server {
    listen 80;
    server_name _;

    # DNS interno de Docker: permite arrancar nginx aunque el bot no este arriba
    resolver 127.0.0.11 ipv6=off valid=10s;

    client_max_body_size 10m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API: mismo origen, sin CORS y sin problemas de contenido mixto
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bot de Telegram: https://<dominio>/bot/telegram/webhook
    location /bot/ {
        set $bot_upstream http://bot:8000;
        rewrite ^/bot/(.*)$ /$1 break;
        proxy_pass $bot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
